{% extends 'events/base.html' %}

{% block title %}Add Event{% endblock %}

{% block content %}
    <div class="form-card">
        <div class="form-header">
            <h2 class="page-title">Add New Event</h2>
            <p>Publish an event so people can find it and book tickets.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {% include 'events/_event_form_fields.html' %}
            <button type="submit" class="btn btn-block">Add Event</button>
        </form>
    </div>
{% endblock %}
