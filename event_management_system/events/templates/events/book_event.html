<!DOCTYPE html>
<html>
<head>
    <title>Book Event</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'events/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h1>Event Management</h1>
            <div class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'event_list' %}">Events</a>
                <a href="{% url 'my_bookings' %}">My Bookings</a>
                <a href="{% url 'logout' %}">Logout</a>
            </div>
        </div>

        <h2 class="page-title">Book Event: {{ event.event_name }}</h2>

        <div class="form-card">
            {% if error %}
                <div class="message-error">{{ error }}</div>
            {% endif %}

            {% if form %}
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn">Confirm Booking</button>
                </form>
            {% else %}
                <div class="message-error">Booking is not available for this event.</div>
            {% endif %}
        </div>

        <div class="footer-link">
            <a href="{% url 'event_detail' event.id %}">Back to Event Detail</a>
        </div>
    </div>
</body>
</html>
