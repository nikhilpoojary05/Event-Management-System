# Render Blueprint: creates the web service and a PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: event-management-db
    plan: free
    databaseName: event_management
    user: event_management

services:
  - type: web
    name: event-management
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd event_management_system && gunicorn event_management_system.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: event-management-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_BEHIND_HTTPS_PROXY
        value: "True"
      - key: WEB_CONCURRENCY  # gunicorn worker processes
        value: "2"
      - key: DJANGO_SEED_DEMO
        value: "True"
      # Asked for when you create the Blueprint; used to create your admin account.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Optional, for real emails (otherwise they are printed in the logs):
      # DJANGO_EMAIL_HOST, DJANGO_EMAIL_HOST_USER, DJANGO_EMAIL_HOST_PASSWORD, DJANGO_DEFAULT_FROM_EMAIL
